apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  template:
    spec:
      # Make sure the permissions on the volume are OK
      initContainers:
        - name: fix-permissions
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              chown 1000:1000 /home/node/.openclaw
              chmod 700 /home/node/.openclaw
              mkdir -p /home/node/.openclaw/credentials
              chown 1000:1000 /home/node/.openclaw/credentials
              chmod 700 /home/node/.openclaw/credentials
              mkdir -p /home/node/.openclaw/client
              chown 1000:1000 /home/node/.openclaw/client
              chmod 700 /home/node/.openclaw/client
              mkdir -p /tmp-volume/gateway-tmp && chmod 1777 /tmp-volume/gateway-tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp-volume
      # Add just the secrets we need
      containers:
        - name: gateway
          env:
            - name: ANTHROPIC_API_KEY
              $patch: delete
            - name: OPENAI_API_KEY
              $patch: delete
            - name: GEMINI_API_KEY
              $patch: delete
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENROUTER_API_KEY
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_APP_TOKEN
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_BOT_TOKEN
