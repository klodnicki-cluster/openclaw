apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
      # Make sure the permissions on the volume are OK
      initContainers:
        - name: fix-permissions
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/client
              chown -R 1000:1000 /home/node/.openclaw
              chmod 700 /home/node/.openclaw
              chmod 700 /home/node/.openclaw/client
              find /home/node/.openclaw -type d -exec chmod 700 {} +
              find /home/node/.openclaw -type f -exec chmod 600 {} +

              mkdir -p /tmp-volume/gateway-tmp && chmod 700 /tmp-volume/gateway-tmp && chown 1000:1000 /tmp-volume/gateway-tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false # so that npm works
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp-volume
      # Add just the secrets we need
      containers:
        - name: gateway
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: ANTHROPIC_API_KEY
              $patch: delete
            - name: OPENAI_API_KEY
              $patch: delete
            - name: GEMINI_API_KEY
              $patch: delete
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENROUTER_API_KEY
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_APP_TOKEN
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_BOT_TOKEN
