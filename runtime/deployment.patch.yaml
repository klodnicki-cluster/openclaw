apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
      # Make sure the permissions on the volume are OK
      initContainers:
        - name: fix-permissions
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/client
              chown -R 1000:1000 /home/node/.openclaw
              chmod 700 /home/node/.openclaw
              chmod 700 /home/node/.openclaw/client
              find /home/node/.openclaw -type d -exec chmod 700 {} +
              find /home/node/.openclaw -type f -exec chmod 600 {} +

              mkdir -p /tmp-volume/gateway-tmp && chmod 700 /tmp-volume/gateway-tmp && chown 1000:1000 /tmp-volume/gateway-tmp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp-volume
              mountPath: /tmp-volume
        - name: install-gog
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              install_dir=/opt/utilities
              binary="$install_dir/gog"
              if [ -x "$binary" ]; then
                installed_version="$("$binary" --version 2>&1)" || installed_version=""
                if printf '%s\n' "$installed_version" | grep -Eq "(^|[^0-9])v?${GOG_VERSION}([^0-9]|$)"; then
                  echo "gog $GOG_VERSION is already installed"
                  exit 0
                fi
              fi

              case "$(uname -m)" in
                x86_64) arch=amd64 ;;
                aarch64) arch=arm64 ;;
                *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac

              asset="gogcli_${GOG_VERSION}_linux_${arch}.tar.gz"
              release_url="https://github.com/openclaw/gogcli/releases/download/v${GOG_VERSION}"
              mkdir -p "$install_dir"
              tmp_dir="$(mktemp -d "$install_dir/.gog.XXXXXX")"
              trap 'rm -rf "$tmp_dir"' EXIT
              wget -qO "$tmp_dir/$asset" "$release_url/$asset"
              wget -qO "$tmp_dir/checksums.txt" "$release_url/checksums.txt"
              checksum_line="$(grep -E "^[[:xdigit:]]{64}  ${asset}\$" "$tmp_dir/checksums.txt")"
              (
                cd "$tmp_dir"
                printf '%s\n' "$checksum_line" | sha256sum -c -
              )
              tar -xzf "$tmp_dir/$asset" -C "$tmp_dir" gog
              chmod 755 "$tmp_dir/gog"
              "$tmp_dir/gog" --version | grep -Eq "(^|[^0-9])v?${GOG_VERSION}([^0-9]|$)"
              mv -f "$tmp_dir/gog" "$binary"
              echo "Installed gog $GOG_VERSION"
          env:
            # renovate: datasource=github-releases depName=openclaw/gogcli
            - name: GOG_VERSION
              value: "0.48.0"
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
          volumeMounts:
            - name: utility-binaries
              mountPath: /opt/utilities
      # Add just the secrets we need
      containers:
        - name: gateway
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false # so that npm works
          env:
            - name: PATH
              value: /opt/utilities:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: ANTHROPIC_API_KEY
              $patch: delete
            - name: OPENAI_API_KEY
              $patch: delete
            - name: GEMINI_API_KEY
              $patch: delete
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENROUTER_API_KEY
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_APP_TOKEN
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_BOT_TOKEN
          resources:
            limits:
              memory: 4Gi
          volumeMounts:
            - name: utility-binaries
              mountPath: /opt/utilities
      volumes:
        - name: utility-binaries
          persistentVolumeClaim:
            claimName: openclaw-utilities-pvc
