apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: gateway
          env:
            - name: ANTHROPIC_API_KEY
              $patch: delete
            - name: OPENAI_API_KEY
              $patch: delete
            - name: GEMINI_API_KEY
              $patch: delete
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENROUTER_API_KEY
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_APP_TOKEN
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: SLACK_BOT_TOKEN
