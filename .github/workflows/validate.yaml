name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Install validation tools
        run: |
          bash scripts/install-tools.sh
          echo "$PWD/.artifacts/bin" >> "$GITHUB_PATH"
          python3 -m pip install --requirement scripts/requirements.txt
          npm install --prefix .github/validation --ignore-scripts --package-lock=false
          npm rebuild --prefix .github/validation re2
          echo "$PWD/.github/validation/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Render, schema-check, and assert deployment policy
        run: python3 scripts/validate.py
      - name: Validate Renovate configuration and real extraction
        run: python3 scripts/validate-renovate.py
      - name: Test pinned runtime, plugin, and startup with dummy credentials
        run: python3 scripts/test-runtime.py
